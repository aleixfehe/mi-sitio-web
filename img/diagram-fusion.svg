      <path d="M0,0 L10,5 L0,10 z" fill="#1c1c1a"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <rect x="20" y="65" width="175" height="110" rx="10" fill="#ffffff" stroke="#1c1c1a" stroke-width="2"/>
  <text x="107" y="112" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1c1a">Sensores</text>
  <text x="107" y="134" text-anchor="middle" font-size="11.5" fill="#6b6b66">fuerza · bioimpedancia</text>
  <text x="107" y="149" text-anchor="middle" font-size="11.5" fill="#6b6b66">posición</text>

