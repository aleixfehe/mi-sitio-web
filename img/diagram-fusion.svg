  <text x="332" y="149" text-anchor="middle" font-size="11.5" fill="#6b6b66">inmunidad EMI</text>

  <rect x="470" y="65" width="195" height="110" rx="10" fill="#ffffff" stroke="#1c1c1a" stroke-width="2"/>
