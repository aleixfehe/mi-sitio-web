  <text x="777" y="149" text-anchor="middle" font-size="11.5" fill="#c9c9c6">fiable</text>

  <line x1="197" y1="120" x2="243" y2="120" stroke="#1c1c1a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="422" y1="120" x2="468" y2="120" stroke="#1c1c1a" stroke-width="2" marker-end="url(#arrow)"/>
