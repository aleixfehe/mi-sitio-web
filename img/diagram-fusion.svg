  <line x1="332" y1="238" x2="332" y2="177" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-muted)"/>
  <text x="332" y="253" text-anchor="middle" font-size="11.5" fill="#6b6b66">ruido / interferencia del electrobisturí</text>
